<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_lente_normal_50mm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Cinema Base Background -->
  <rect width="400" height="240" rx="16" fill="url(#bgGrad_lente_normal_50mm)" stroke="#1e293b" stroke-width="2"/>

  <!-- Illustrative Graphic Zone -->
  
        <!-- 50mm Standard Human Eye View -->
        <rect x="40" y="30" width="320" height="150" rx="8" fill="#0c0919" stroke="#1e293b" />
        
    <!-- Viewfinder Reticles -->
    <path d="M70 61 L70 45 L86 45" stroke="#38bdf8" stroke-width="2" fill="none" />
    <path d="M314 45 L330 45 L330 61" stroke="#38bdf8" stroke-width="2" fill="none" />
    <path d="M70 149 L70 165 L86 165" stroke="#38bdf8" stroke-width="2" fill="none" />
    <path d="M314 165 L330 165 L314 165" stroke="#38bdf8" stroke-width="2" fill="none" />
    <!-- Center Crosshair -->
    <line x1="192" y1="105" x2="208" y2="105" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <line x1="200" y1="97" x2="200" y2="113" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <!-- 16:9 safe zone marker -->
    <rect x="84" y="55" width="232" height="100" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="4 4" stroke-opacity="0.25" />
  
        
    <g transform="translate(200, 105) scale(1.2)">
      <!-- Cabeça -->
      <circle cx="0" cy="-25" r="9" fill="#e9d5ff" />
      <circle cx="-2" cy="-25" r="1.5" fill="#0b0f19" /><path d="M-4 -20 Q0 -17 4 -20" stroke="#0b0f19" stroke-width="0.8" fill="none" />
      <!-- Pescoço e Ombros -->
      <path d="M-3 -16 L3 -16 L6 -10 L16 2 L-16 2 L-6 -10 Z" fill="#e9d5ff" />
      <!-- Torso -->
      <path d="M-15 2 L15 2 L11 28 L-11 28 Z" fill="#e9d5ff" fill-opacity="0.9" />
      <!-- Pernas -->
      <path d="M-10 28 L-4 28 L-3 62 L-9 62 Z M4 28 L10 28 L9 62 L3 62 Z" fill="#e9d5ff" fill-opacity="0.8" />
    </g>
  
        <line x1="70" y1="135" x2="330" y2="135" stroke="#334155" stroke-width="1.5" />
        <text x="200" y="172" text-anchor="middle" fill="#c084fc" font-size="11" font-family="monospace">50mm NORMAL LENS (NATURAL PERSPECTIVE)</text>
      

  <!-- Header Category Badge -->
  <g transform="translate(16, 22)">
    <rect x="0" y="-12" width="170" height="20" rx="5" fill="#a855f7" fill-opacity="0.18" stroke="#a855f7" stroke-width="1.2"/>
    <text x="8" y="2" fill="#c084fc" font-size="9" font-family="monospace" font-weight="bold">LENTES & PERSPECTIVA</text>
  </g>

  <!-- Footer Title and Code -->
  <rect x="0" y="196" width="400" height="44" fill="#04060b" fill-opacity="0.95" />
  <line x1="0" y1="196" x2="400" y2="196" stroke="#1e293b" stroke-width="1.2"/>
  
  <text x="16" y="215" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="bold">Lente Normal / Natural (50mm)</text>
  <text x="16" y="229" fill="#94a3b8" font-size="9" font-family="monospace">Standard Normal Lens (50mm)</text>
  
  <rect x="310" y="206" width="74" height="20" rx="4" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="0.8"/>
