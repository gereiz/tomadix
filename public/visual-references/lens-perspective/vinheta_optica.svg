<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_vinheta_optica" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Cinema Base Background -->
  <rect width="400" height="240" rx="16" fill="url(#bgGrad_vinheta_optica)" stroke="#1e293b" stroke-width="2"/>

  <!-- Illustrative Graphic Zone -->
  
        <!-- Generic Optical Barrel Diagram -->
        <rect x="40" y="30" width="320" height="150" rx="8" fill="#0c0919" stroke="#1e293b" />
        <rect x="90" y="65" width="220" height="80" rx="8" fill="#13102b" stroke="#a855f7" stroke-width="2" />
        <!-- Lens glass elements -->
        <path d="M120 70 Q135 105 120 140" stroke="#38bdf8" stroke-width="4" fill="none" />
        <path d="M180 70 Q165 105 180 140" stroke="#c084fc" stroke-width="4" fill="none" />
        <path d="M240 70 Q255 105 240 140" stroke="#38bdf8" stroke-width="4" fill="none" />
        <text x="200" y="172" text-anchor="middle" fill="#c084fc" font-size="11" font-family="monospace">OPTICAL VIGNETTING</text>
      

  <!-- Header Category Badge -->
  <g transform="translate(16, 22)">
    <rect x="0" y="-12" width="170" height="20" rx="5" fill="#a855f7" fill-opacity="0.18" stroke="#a855f7" stroke-width="1.2"/>
    <text x="8" y="2" fill="#c084fc" font-size="9" font-family="monospace" font-weight="bold">LENTES & PERSPECTIVA</text>
  </g>

  <!-- Footer Title and Code -->
  <rect x="0" y="196" width="400" height="44" fill="#04060b" fill-opacity="0.95" />
  <line x1="0" y1="196" x2="400" y2="196" stroke="#1e293b" stroke-width="1.2"/>
  
  <text x="16" y="215" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="bold">Vinheta Óptica Natural (Vignetting)</text>
  <text x="16" y="229" fill="#94a3b8" font-size="9" font-family="monospace">Optical Vignetting</text>
  
  <rect x="310" y="206" width="74" height="20" rx="4" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="0.8"/>
  <text x="347" y="220" text-anchor="middle" fill="#c084fc" font-size="9" font-family="monospace" font-weight="bold">REF V2.0</text>
</svg>