<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_ultra_grande_angular_14mm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Cinema Base Background -->
  <rect width="400" height="240" rx="16" fill="url(#bgGrad_ultra_grande_angular_14mm)" stroke="#1e293b" stroke-width="2"/>

  <!-- Illustrative Graphic Zone -->
  
        <!-- Fisheye 180 Degree Warped Grid -->
        <rect x="40" y="30" width="320" height="150" rx="8" fill="#080714" stroke="#1e293b" />
        <circle cx="200" cy="105" r="60" fill="#0f0e26" stroke="#c084fc" stroke-width="2.5" />
        <!-- Curving distorted grid lines -->
        <ellipse cx="200" cy="105" rx="50" ry="25" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3" />
        <ellipse cx="200" cy="105" rx="25" ry="50" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3" />
        <circle cx="200" cy="105" r="14" fill="#e9d5ff" />
        <text x="200" y="172" text-anchor="middle" fill="#c084fc" font-size="11" font-family="monospace">180° ULTRA WIDE / FISHEYE BARREL</text>
      

  <!-- Header Category Badge -->
  <g transform="translate(16, 22)">
    <rect x="0" y="-12" width="170" height="20" rx="5" fill="#a855f7" fill-opacity="0.18" stroke="#a855f7" stroke-width="1.2"/>
    <text x="8" y="2" fill="#c084fc" font-size="9" font-family="monospace" font-weight="bold">LENTES & PERSPECTIVA</text>
  </g>

  <!-- Footer Title and Code -->
  <rect x="0" y="196" width="400" height="44" fill="#04060b" fill-opacity="0.95" />
  <line x1="0" y1="196" x2="400" y2="196" stroke="#1e293b" stroke-width="1.2"/>
  
  <text x="16" y="215" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="bold">Lente Ultra Grande-Angular (14mm / 16mm)</text>
  <text x="16" y="229" fill="#94a3b8" font-size="9" font-family="monospace">Ultra Wide-Angle (14mm)</text>
  
  <rect x="310" y="206" width="74" height="20" rx="4" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="0.8"/>
  <text x="347" y="220" text-anchor="middle" fill="#c084fc" font-size="9" font-family="monospace" font-weight="bold">REF V2.0</text>
</svg>