<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_medium_full_shot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Cinema Base Background -->
  <rect width="400" height="240" rx="16" fill="url(#bgGrad_medium_full_shot)" stroke="#1e293b" stroke-width="2"/>

  <!-- Illustrative Graphic Zone -->
  
        
    <!-- Viewfinder Reticles -->
    <path d="M40 46 L40 30 L56 30" stroke="#38bdf8" stroke-width="2" fill="none" />
    <path d="M344 30 L360 30 L360 46" stroke="#38bdf8" stroke-width="2" fill="none" />
    <path d="M40 164 L40 180 L56 180" stroke="#38bdf8" stroke-width="2" fill="none" />
    <path d="M344 180 L360 180 L344 180" stroke="#38bdf8" stroke-width="2" fill="none" />
    <!-- Center Crosshair -->
    <line x1="192" y1="105" x2="208" y2="105" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <line x1="200" y1="97" x2="200" y2="113" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <!-- 16:9 safe zone marker -->
    <rect x="54" y="40" width="292" height="130" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="4 4" stroke-opacity="0.25" />
  
        <!-- Full Shot (Head to Toe) -->
        
    <g transform="translate(200, 85) scale(0.9)">
      <!-- Cabeça -->
      <circle cx="0" cy="-25" r="9" fill="#38bdf8" />
      <circle cx="-2" cy="-25" r="1.5" fill="#0b0f19" /><path d="M-4 -20 Q0 -17 4 -20" stroke="#0b0f19" stroke-width="0.8" fill="none" />
      <!-- Pescoço e Ombros -->
      <path d="M-3 -16 L3 -16 L6 -10 L16 2 L-16 2 L-6 -10 Z" fill="#38bdf8" />
      <!-- Torso -->
      <path d="M-15 2 L15 2 L11 28 L-11 28 Z" fill="#38bdf8" fill-opacity="0.9" />
      <!-- Pernas -->
      <path d="M-10 28 L-4 28 L-3 62 L-9 62 Z M4 28 L10 28 L9 62 L3 62 Z" fill="#38bdf8" fill-opacity="0.8" />
    </g>
  
        <line x1="120" y1="145" x2="280" y2="145" stroke="#334155" stroke-width="1.5" />
        <text x="200" y="170" text-anchor="middle" fill="#38bdf8" font-size="11" font-family="monospace">FULL SHOT (FS)</text>
      

  <!-- Header Category Badge -->
  <g transform="translate(16, 22)">
    <rect x="0" y="-12" width="170" height="20" rx="5" fill="#06b6d4" fill-opacity="0.18" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="8" y="2" fill="#38bdf8" font-size="9" font-family="monospace" font-weight="bold">ENQUADRAMENTO</text>
  </g>

  <!-- Footer Title and Code -->
  <rect x="0" y="196" width="400" height="44" fill="#04060b" fill-opacity="0.95" />
  <line x1="0" y1="196" x2="400" y2="196" stroke="#1e293b" stroke-width="1.2"/>
  
  <text x="16" y="215" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="bold">Plano Americano (Medium Full Shot / Cowb...</text>
  <text x="16" y="229" fill="#94a3b8" font-size="9" font-family="monospace">Medium Full Shot / Cowboy</text>
  
  <rect x="310" y="206" width="74" height="20" rx="4" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="0.8"/>
  <text x="347" y="220" text-anchor="middle" fill="#38bdf8" font-size="9" font-family="monospace" font-weight="bold">REF V2.0</text>
</svg>