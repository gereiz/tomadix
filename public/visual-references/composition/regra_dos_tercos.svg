<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_regra_dos_tercos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Cinema Base Background -->
  <rect width="400" height="240" rx="16" fill="url(#bgGrad_regra_dos_tercos)" stroke="#1e293b" stroke-width="2"/>

  <!-- Illustrative Graphic Zone -->
  
        <!-- Rule of Thirds 3x3 Matrix Grid -->
        <rect x="50" y="35" width="300" height="140" rx="6" fill="#0e0717" stroke="#334155" stroke-width="1.5" />
        <!-- Vertical Grid Lines -->
        <line x1="150" y1="35" x2="150" y2="175" stroke="#ec4899" stroke-width="2" />
        <line x1="250" y1="35" x2="250" y2="175" stroke="#ec4899" stroke-width="2" />
        <!-- Horizontal Grid Lines -->
        <line x1="50" y1="82" x2="350" y2="82" stroke="#ec4899" stroke-width="2" />
        <line x1="50" y1="128" x2="350" y2="128" stroke="#ec4899" stroke-width="2" />
        <!-- 4 Golden Intersection Points -->
        <circle cx="150" cy="82" r="7" fill="#f472b6" filter="drop-shadow(0 0 8px #ec4899)" />
        <circle cx="250" cy="82" r="7" fill="#f472b6" filter="drop-shadow(0 0 8px #ec4899)" />
        <circle cx="150" cy="128" r="7" fill="#f472b6" />
        <circle cx="250" cy="128" r="7" fill="#f472b6" />
        <!-- Actor aligned on right third -->
        
    <g transform="translate(250, 95) scale(0.9)">
      <!-- Cabeça -->
      <circle cx="0" cy="-25" r="9" fill="#fbcfe8" />
      <circle cx="-2" cy="-25" r="1.5" fill="#0b0f19" /><path d="M-4 -20 Q0 -17 4 -20" stroke="#0b0f19" stroke-width="0.8" fill="none" />
      <!-- Pescoço e Ombros -->
      <path d="M-3 -16 L3 -16 L6 -10 L16 2 L-16 2 L-6 -10 Z" fill="#fbcfe8" />
      <!-- Torso -->
      <path d="M-15 2 L15 2 L11 28 L-11 28 Z" fill="#fbcfe8" fill-opacity="0.9" />
      <!-- Pernas -->
      <path d="M-10 28 L-4 28 L-3 62 L-9 62 Z M4 28 L10 28 L9 62 L3 62 Z" fill="#fbcfe8" fill-opacity="0.8" />
    </g>
  
        <text x="200" y="172" text-anchor="middle" fill="#f472b6" font-size="11" font-family="monospace">RULE OF THIRDS (3x3 GOLDEN INTERSECTIONS)</text>
      

  <!-- Header Category Badge -->
  <g transform="translate(16, 22)">
    <rect x="0" y="-12" width="170" height="20" rx="5" fill="#ec4899" fill-opacity="0.18" stroke="#ec4899" stroke-width="1.2"/>
    <text x="8" y="2" fill="#f472b6" font-size="9" font-family="monospace" font-weight="bold">COMPOSIÇÃO</text>
  </g>

  <!-- Footer Title and Code -->
  <rect x="0" y="196" width="400" height="44" fill="#04060b" fill-opacity="0.95" />
  <line x1="0" y1="196" x2="400" y2="196" stroke="#1e293b" stroke-width="1.2"/>
  
  <text x="16" y="215" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="bold">Regra dos Terços (Rule of Thirds)</text>
  <text x="16" y="229" fill="#94a3b8" font-size="9" font-family="monospace">Rule of Thirds</text>
  
  <rect x="310" y="206" width="74" height="20" rx="4" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="0.8"/>
  <text x="347" y="220" text-anchor="middle" fill="#f472b6" font-size="9" font-family="monospace" font-weight="bold">REF V2.0</text>
</svg>