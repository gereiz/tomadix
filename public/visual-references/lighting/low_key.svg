<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_low_key" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Cinema Base Background -->
  <rect width="400" height="240" rx="16" fill="url(#bgGrad_low_key)" stroke="#1e293b" stroke-width="2"/>

  <!-- Illustrative Graphic Zone -->
  
        <!-- High Contrast Dramatic Light Scene -->
        <rect x="40" y="30" width="320" height="150" rx="8" fill="#05070d" stroke="#334155" stroke-width="1.5" />
        <!-- Spot of light beam -->
        <polygon points="50,40 180,80 160,170 50,170" fill="#f59e0b" fill-opacity="0.15" />
        <!-- Sculpted face portrait in shadow -->
        <path d="M210 50 Q235 50 240 75 Q245 105 235 130 Q225 150 205 160 Q185 150 175 130 Q165 105 170 75 Q175 50 210 50 Z" fill="#1e293b" />
        <!-- Light side highlight -->
        <path d="M170 75 Q175 50 210 50 L210 160 Q185 150 175 130 Q165 105 170 75 Z" fill="#fbbf24" fill-opacity="0.85" />
        <!-- Rembrandt Triangle on cheek in shadow -->
        <polygon points="222,95 234,102 225,112" fill="#fbbf24" />
        <text x="260" y="105" fill="#fde047" font-size="10" font-family="monospace">REMBRANDT LIGHT</text>
      

  <!-- Header Category Badge -->
  <g transform="translate(16, 22)">
    <rect x="0" y="-12" width="170" height="20" rx="5" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="8" y="2" fill="#fbbf24" font-size="9" font-family="monospace" font-weight="bold">ILUMINAÇÃO</text>
  </g>

  <!-- Footer Title and Code -->
  <rect x="0" y="196" width="400" height="44" fill="#04060b" fill-opacity="0.95" />
  <line x1="0" y1="196" x2="400" y2="196" stroke="#1e293b" stroke-width="1.2"/>
  
  <text x="16" y="215" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="bold">Low-Key Lighting (Penumbra & Mistério)</text>
  <text x="16" y="229" fill="#94a3b8" font-size="9" font-family="monospace">Low-Key Lighting</text>
  
  <rect x="310" y="206" width="74" height="20" rx="4" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="347" y="220" text-anchor="middle" fill="#fbbf24" font-size="9" font-family="monospace" font-weight="bold">REF V2.0</text>
</svg>