  <text x="16" y="215" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="bold">Silhueta Total (Silhouette)</text>
  <text x="16" y="229" fill="#94a3b8" font-size="9" font-family="monospace">Silhouette Lighting</text>
  
