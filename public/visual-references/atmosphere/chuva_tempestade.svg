  <line x1="0" y1="196" x2="400" y2="196" stroke="#1e293b" stroke-width="1.2"/>
  
  <text x="16" y="215" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="bold">Chuva Torrencial & Asfalto Molhado (Cine...</text>
  <text x="16" y="229" fill="#94a3b8" font-size="9" font-family="monospace">Cinematic Rain & Wet Streets</text>
  
  <rect x="310" y="206" width="74" height="20" rx="4" fill="#14b8a6" fill-opacity="0.2" stroke="#14b8a6" stroke-width="0.8"/>
  <text x="347" y="220" text-anchor="middle" fill="#2dd4bf" font-size="9" font-family="monospace" font-weight="bold">REF V2.0</text>
