<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_vintage_16mm_format" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Cinema Base Background -->
  <rect width="400" height="240" rx="16" fill="url(#bgGrad_vintage_16mm_format)" stroke="#1e293b" stroke-width="2"/>

  <!-- Illustrative Graphic Zone -->
  
      <!-- Camera Lens Mount Collar -->
      <rect x="40" y="30" width="320" height="150" rx="8" fill="#080718" stroke="#1e293b" />
      <circle cx="200" cy="105" r="68" fill="#120e29" stroke="#334155" stroke-width="2" />
      <!-- Silicon Wafer iridescent gradient -->
      <defs>
        <linearGradient id="sensorWaferGrad_vintage_16mm_format" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#311042" />
          <stop offset="40%" stop-color="#1e1b4b" />
          <stop offset="75%" stop-color="#0284c7" />
          <stop offset="100%" stop-color="#14532d" />
        </linearGradient>
      </defs>
      <!-- Active Sensor Area -->
      <rect x="110" y="55" width="180" height="100" rx="4" fill="url(#sensorWaferGrad_vintage_16mm_format)" stroke="#8b5cf6" stroke-width="2.5" filter="drop-shadow(0 0 10px #8b5cf6)" />
      <!-- Gold Bond Wires / Contacts -->
      <rect x="114" y="59" width="172" height="3" fill="#fbbf24" />
      <rect x="114" y="148" width="172" height="3" fill="#fbbf24" />
      <!-- Center Sensor Reticle Cross -->
      <line x1="190" y1="105" x2="210" y2="105" stroke="#ffffff" stroke-width="1.2" />
      <line x1="200" y1="95" x2="200" y2="115" stroke="#ffffff" stroke-width="1.2" />
      <text x="200" y="172" text-anchor="middle" fill="#a78bfa" font-size="11" font-family="monospace">36 x 24mm (FULL FRAME)</text>
    

  <!-- Header Category Badge -->
  <g transform="translate(16, 22)">
    <rect x="0" y="-12" width="170" height="20" rx="5" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="8" y="2" fill="#a78bfa" font-size="9" font-family="monospace" font-weight="bold">FORMATO DO SENSOR</text>
  </g>

  <!-- Footer Title and Code -->
  <rect x="0" y="196" width="400" height="44" fill="#04060b" fill-opacity="0.95" />
  <line x1="0" y1="196" x2="400" y2="196" stroke="#1e293b" stroke-width="1.2"/>
  
  <text x="16" y="215" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="bold">16mm Vintage / Fotograma Reduzido (Grão ...</text>
  <text x="16" y="229" fill="#94a3b8" font-size="9" font-family="monospace">16mm Vintage Gate</text>
  
  <rect x="310" y="206" width="74" height="20" rx="4" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="0.8"/>
  <text x="347" y="220" text-anchor="middle" fill="#a78bfa" font-size="9" font-family="monospace" font-weight="bold">REF V2.0</text>
</svg>